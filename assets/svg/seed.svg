<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="80" height="100" fill="none">
  <!-- soil mound -->
  <ellipse cx="40" cy="82" rx="34" ry="10" fill="#c9b896" opacity="0.6"/>
  <ellipse cx="40" cy="80" rx="34" ry="10" fill="#d4c4a8"/>
  <path d="M10 78 Q25 70 40 75 Q55 70 70 78" stroke="#bfaa8a" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- seed -->
  <ellipse cx="40" cy="68" rx="8" ry="6" fill="#a9825a"/>
  <ellipse cx="38" cy="66" rx="3" ry="2.5" fill="#c4a87a" opacity="0.6"/>

  <!-- tiny sprout -->
  <path d="M40 62 Q40 54 40 48" stroke="#7fa86b" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M40 50 Q34 44 28 42" stroke="#7fa86b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M40 48 Q47 40 50 38" stroke="#7fa86b" stroke-width="1.8" stroke-linecap="round"/>

  <!-- small leaf on sprout -->
  <ellipse cx="28" cy="42" rx="5" ry="3" fill="#7fa86b" transform="rotate(-20 28 42)"/>
  <ellipse cx="50" cy="38" rx="4.5" ry="2.8" fill="#7fa86b" transform="rotate(15 50 38)"/>

  <!-- soft glow around seed -->
  <circle cx="40" cy="65" r="16" fill="#f4df9b" opacity="0.15"/>
</svg>
