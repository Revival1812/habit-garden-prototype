<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Habit Tree Layout Lab</title>
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/tree-growth.css" />
  <style>
    body {
      background: #f7f3ea;
      color: #263328;
    }

    .tree-lab-page {
      width: min(1240px, 96vw);
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .tree-lab-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .tree-lab-title {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .tree-lab-note {
      margin: 6px 0 0;
      color: #687466;
      font-size: 14px;
      line-height: 1.5;
    }

    .tree-lab-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: #687466;
      font-size: 13px;
    }

    .tree-lab-legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tree-lab-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
    }

    .tree-lab-stage {
      width: 100%;
      aspect-ratio: 1200 / 760;
      min-height: 420px;
      border: 1px solid rgba(63, 95, 70, 0.16);
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 84%, rgba(190, 212, 169, 0.2), transparent 28%),
        rgba(255, 253, 247, 0.72);
      box-shadow: 0 18px 40px rgba(63, 95, 70, 0.1);
      overflow: hidden;
    }

    .tree-lab-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    @media (max-width: 720px) {
      .tree-lab-header {
        align-items: start;
        flex-direction: column;
      }

      .tree-lab-title {
        font-size: 20px;
      }
    }
  </style>
  <script defer src="assets/js/tree-layout-registry.js"></script>
</head>
<body>
  <main class="tree-lab-page">
    <header class="tree-lab-header">
      <div>
        <h1 class="tree-lab-title">Habit Tree Layout Lab</h1>
        <p class="tree-lab-note">Use this page to calibrate trunk attach points, branch anchors, boxes, and leaf slots.</p>
      </div>
      <div class="tree-lab-legend" aria-label="Debug legend">
        <span style="color:#2f7dbd"><i class="tree-lab-swatch"></i>attach</span>
        <span style="color:#d45a43"><i class="tree-lab-swatch"></i>anchor</span>
        <span style="color:#8f6cc9"><i class="tree-lab-swatch"></i>leaf slot</span>
        <span style="color:#d7a339"><i class="tree-lab-swatch"></i>box</span>
      </div>
    </header>

    <section class="tree-lab-stage" aria-label="Tree layout calibration canvas">
      <svg id="treeLabSvg" class="habit-growth-svg tree-lab-svg" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Tree layout debug grid"></svg>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      var NS = 'http://www.w3.org/2000/svg';

      function svgEl(tag, attrs) {
        var el = document.createElementNS(NS, tag);
        if (attrs) {
          Object.keys(attrs).forEach(function (key) {
            el.setAttribute(key, attrs[key]);
          });
        }
        return el;
      }

      function label(parent, text, x, y) {
        var node = svgEl('text', {
          x: x,
          y: y,
          class: 'tree-debug-label'
        });
        node.textContent = text;
        parent.appendChild(node);
      }

      function drawGrid(svg, registry) {
        var grid = svgEl('g', { class: 'tree-debug-grid' });
        var step = 40;

        for (var x = 0; x <= registry.world.width; x += step) {
          grid.appendChild(svgEl('line', {
            x1: x,
            y1: 0,
            x2: x,
            y2: registry.world.height,
            class: x % 200 === 0 ? 'tree-debug-grid-major' : ''
          }));
          if (x % 200 === 0) label(grid, String(x), x + 4, 16);
        }

        for (var y = 0; y <= registry.world.height; y += step) {
          grid.appendChild(svgEl('line', {
            x1: 0,
            y1: y,
            x2: registry.world.width,
            y2: y,
            class: y % 200 === 0 ? 'tree-debug-grid-major' : ''
          }));
          if (y % 200 === 0 && y > 0) label(grid, String(y), 4, y - 4);
        }

        svg.appendChild(grid);
      }

      function drawPoint(parent, point, className, text) {
        var radius = 5;
        if (className === 'tree-asset-anchor') radius = 7;
        if (className === 'tree-attach-point') radius = 4;
        if (className === 'tree-debug-leaf-slot') radius = 3;

        parent.appendChild(svgEl('circle', {
          cx: point.x,
          cy: point.y,
          r: radius,
          class: 'tree-debug-point ' + className
        }));
        parent.appendChild(svgEl('line', {
          x1: point.x - 11,
          y1: point.y,
          x2: point.x + 11,
          y2: point.y,
          class: className
        }));
        parent.appendChild(svgEl('line', {
          x1: point.x,
          y1: point.y - 11,
          x2: point.x,
          y2: point.y + 11,
          class: className
        }));
        if (text) label(parent, text, point.x + 8, point.y - 8);
      }

      function scaledLocalPoint(pos, localPoint, scale) {
        return {
          x: pos.x + localPoint.x * scale,
          y: pos.y + localPoint.y * scale
        };
      }

      function imagePositionFromAnchor(attach, asset, scale) {
        return {
          x: attach.x - asset.anchor.x * scale,
          y: attach.y - asset.anchor.y * scale
        };
      }

      function drawImage(parent, href, x, y, width, height, className) {
        parent.appendChild(svgEl('image', {
          href: href,
          x: x,
          y: y,
          width: width,
          height: height,
          class: className || '',
          preserveAspectRatio: 'xMidYMid meet'
        }));
      }

      function drawBox(parent, x, y, width, height, text) {
        parent.appendChild(svgEl('rect', {
          x: x,
          y: y,
          width: width,
          height: height,
          class: 'tree-debug-box'
        }));
        if (text) label(parent, text, x + 4, y - 6);
      }

      function drawTrunk(svg, registry) {
        var trunk = registry.trunk;
        var group = svgEl('g', { class: 'tree-trunk' });
        trunk.layers.forEach(function (layer) {
          drawImage(group, layer.href, trunk.x, trunk.y, trunk.width, trunk.height, layer.className);
        });
        svg.appendChild(group);
        drawBox(svg, trunk.x, trunk.y, trunk.width, trunk.height, 'trunk box');
      }

      function drawLeafSlots(parent, branchAsset, branchPos, branchScale, branchRotation, attach) {
        var weekAsset = window.TreeLayoutRegistry.weekBranchAssets.weekRight;
        var weekAttach = scaledLocalPoint(branchPos, branchAsset.tip, branchScale);
        var weekScale = weekAsset.defaultScale;
        var weekPos = imagePositionFromAnchor(weekAttach, weekAsset, weekScale);
        var weekWidth = weekAsset.width * weekScale;
        var weekHeight = weekAsset.height * weekScale;
        var group = svgEl('g', {
          transform: 'rotate(' + branchRotation + ' ' + attach.x + ' ' + attach.y + ')'
        });

        drawImage(group, weekAsset.href, weekPos.x, weekPos.y, weekWidth, weekHeight, 'branch-piece');
        drawBox(group, weekPos.x, weekPos.y, weekWidth, weekHeight, 'week box');
        drawPoint(group, weekAttach, 'tree-attach-point', 'week attach');

        weekAsset.leafSlots.forEach(function (slot, index) {
          var slotPoint = scaledLocalPoint(weekPos, slot, weekScale);
          drawPoint(group, slotPoint, 'tree-debug-leaf-slot', 'leaf ' + (index + 1));
        });

        parent.appendChild(group);
      }

      function drawHabitBranch(svg, registry, slot) {
        var asset = registry.branchAssets[slot.asset];
        var scale = slot.scale * (asset.defaultScale || 1);
        var width = asset.width * scale;
        var height = asset.height * scale;
        var pos = imagePositionFromAnchor(slot.attach, asset, scale);
        var group = svgEl('g', {
          class: 'tree-lab-branch',
          transform: 'rotate(' + slot.rotation + ' ' + slot.attach.x + ' ' + slot.attach.y + ')'
        });
        var anchorPoint = scaledLocalPoint(pos, asset.anchor, scale);

        drawImage(group, asset.href, pos.x, pos.y, width, height, 'branch-piece');
        drawBox(group, pos.x, pos.y, width, height, slot.id);
        drawPoint(group, anchorPoint, 'tree-asset-anchor', 'anchor');
        drawPoint(group, slot.attach, 'tree-attach-point', 'attach');
        drawLeafSlots(group, asset, pos, scale, 0, slot.attach);

        svg.appendChild(group);
      }

      function init() {
        var registry = window.TreeLayoutRegistry;
        var svg = document.getElementById('treeLabSvg');
        if (!registry || !svg) return;

        drawGrid(svg, registry);
        drawTrunk(svg, registry);

        registry.habitSlots.slice(0, 3).forEach(function (slot) {
          drawHabitBranch(svg, registry, slot);
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
